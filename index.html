<!DOCTYPE html>
<html>

<head>

  <title>AI Exam Generator</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>📄 AI Exam Generator</h1>

    <p class="subtitle">
      Create professional exam papers in seconds
    </p>

    <!-- AUTH BOX -->

    <div class="auth-box">

      <h2>🔐 User Authentication</h2>

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
      >

      <button onclick="signup()">
        Sign Up
      </button>

      <button onclick="login()">
        Login
      </button>

    </div>

    <!-- MAIN FORM -->

    <div class="form-card">

      <!-- School Name -->

      <div class="input-group">

        <label>School Name</label>

        <input
          id="school_name"
          placeholder="e.g. ABC Public School"
        >

      </div>

      <!-- Exam Name -->

      <div class="input-group">

        <label>Exam Name</label>

        <input
          id="exam_name"
          placeholder="e.g. Half Yearly Examination"
        >

      </div>

      <!-- Class -->

      <div class="input-group">

        <label>Class</label>

        <input
          id="class"
          placeholder="e.g. 10"
        >

      </div>

      <!-- Subject -->

      <div class="input-group">

        <label>Subject</label>

        <input
          id="subject"
          placeholder="e.g. Mathematics"
        >

      </div>

      <!-- Topics -->

      <div class="input-group">

        <label>Topics</label>

        <input
          id="topics"
          placeholder="e.g. Trigonometry"
        >

      </div>

      <!-- TOP ROW -->

      <div class="row">

        <!-- Difficulty -->

        <div class="input-group">

          <label>Difficulty</label>

          <select id="difficulty">

            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>

          </select>

        </div>

        <!-- Exam Type -->

        <div class="input-group">

          <label>
            Exam Type
            <span style="font-size:12px; color:gray;">
              (Optional)
            </span>
          </label>

          <select id="exam_type">

            <option value="">None</option>

            <option value="CBSE">CBSE</option>
            <option value="ICSE">ICSE</option>
            <option value="JEE">JEE</option>
            <option value="NEET">NEET</option>
            <option value="SSC">SSC</option>

          </select>

        </div>

        <!-- Time Limit -->

        <div class="input-group">

          <label>Time Limit</label>

          <select
            id="time_limit"
            onchange="handleCustom('time_limit','custom_time')"
          >

            <option value="1 Hour">1 Hour</option>
            <option value="2 Hours">2 Hours</option>
            <option value="3 Hours">3 Hours</option>
            <option value="custom">Custom</option>

          </select>

          <input
            id="custom_time"
            placeholder="Enter custom time"
            style="display:none;"
          >

        </div>

        <!-- Total Marks -->

        <div class="input-group">

          <label>Total Marks</label>

          <input
            id="total"
            placeholder="e.g. 50"
          >

        </div>

      </div>

      <!-- SECTION SETTINGS -->

      <h3>📊 Section Settings</h3>

      <p>
        Add or remove sections as needed.
        Section A is mandatory.
      </p>

      <div id="sectionsContainer">

      </div>

      <button
        type="button"
        onclick="addSection()"
        class="btn"
      >
       ➕ Add Section
      </button>

      <!-- PYQ UPLOAD -->

      <div class="input-group">

        <label>
          Upload Previous Year Papers
          <span style="font-size:12px; color:gray;">
            (Optional • Max 5 Files)
          </span>
        </label>

        <input
          type="file"
          id="pyq_files"
          multiple
          accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"
        >

      </div>

      <!-- INSTRUCTIONS -->

      <div class="input-group">

        <label>Instructions (one per line)</label>

        <textarea
          id="instructions"
          placeholder="e.g.
No negative marking
All questions compulsory"
        ></textarea>

      </div>

      <!-- ANSWER KEY -->

      <div class="toggle-box">

        <label>Include Answer Key</label>

        <input
          type="checkbox"
          id="includeAnswers"
          checked
        >

      </div>

      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >
        ⏳ Generating...
      </div>

      <!-- GENERATE BUTTON -->

      <div id="planCard">

        <h2>
          Account Dashboard
        </h2>

        <p id="userPlan">
        </p>

        <p id="userCredits">
        </p>

        <p id="userStatus">
        </p>

        <p id="userExpiry">
        </p>

      </div>

      <div id="pricing">

        <h2>Upgrade Plan</h2>

        <button onclick="upgradePro()">
          PRO ₹99/month
        </button>

        <button onclick="upgradePremium()">
          PREMIUM ₹399/6 months
        </button>

      </div>

      <button
        onclick="openMyPapers()"
        class="btn"
      >
        📚 My Papers
      </button>

      <button
        onclick="generatePDF()"
        class="btn"
      >
        🚀 Generate Exam Paper
      </button>

      <!-- DOWNLOAD RESULT -->

      <div class="result">

        <a
          id="downloadLink"
          target="_blank"
        ></a>

      </div>

    </div>

  </div>

  <script src="./script.js"></script>

</body>

</html>
