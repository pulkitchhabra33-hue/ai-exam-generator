<!DOCTYPE html>
<html>

<head>

  <title>AI Exam Generator</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>📄 AI Exam Generator</h1>

    <p class="subtitle">
      Create professional exam papers in seconds
    </p>

    <!-- AUTH BOX -->

    <div class="auth-box">

      <h2>🔐 User Authentication</h2>

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
      >

      <button onclick="signup()">
        Sign Up
      </button>

      <button onclick="login()">
        Login
      </button>

    </div>

    <!-- MAIN FORM -->

    <div class="form-card">

      <!-- School Name -->

      <div class="input-group">

        <label>School Name</label>

        <input
          id="school_name"
          placeholder="e.g. ABC Public School"
        >

      </div>

      <!-- Exam Name -->

      <div class="input-group">

        <label>Exam Name</label>

        <input
          id="exam_name"
          placeholder="e.g. Half Yearly Examination"
        >

      </div>

      <!-- Class -->

      <div class="input-group">

        <label>Class</label>

        <input
          id="class"
          placeholder="e.g. 10"
        >

      </div>

      <!-- Subject -->

      <div class="input-group">

        <label>Subject</label>

        <input
          id="subject"
          placeholder="e.g. Mathematics"
        >

      </div>

      <!-- Topics -->

      <div class="input-group">

        <label>Topics</label>

        <input
          id="topics"
          placeholder="e.g. Trigonometry"
        >

      </div>

      <!-- TOP ROW -->

      <div class="row">

        <!-- Difficulty -->

        <div class="input-group">

          <label>Difficulty</label>

          <select id="difficulty">

            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>

          </select>

        </div>

        <!-- Exam Type -->

        <div class="input-group">

          <label>
            Exam Type
            <span style="font-size:12px; color:gray;">
              (Optional)
            </span>
          </label>

          <select id="exam_type">

            <option value="">None</option>

            <option value="CBSE">CBSE</option>
            <option value="ICSE">ICSE</option>
            <option value="JEE">JEE</option>
            <option value="NEET">NEET</option>
            <option value="SSC">SSC</option>

          </select>

        </div>

        <!-- Time Limit -->

        <div class="input-group">

          <label>Time Limit</label>

          <select
            id="time_limit"
            onchange="handleCustom('time_limit','custom_time')"
          >

            <option value="1 Hour">1 Hour</option>
            <option value="2 Hours">2 Hours</option>
            <option value="3 Hours">3 Hours</option>
            <option value="custom">Custom</option>

          </select>

          <input
            id="custom_time"
            placeholder="Enter custom time"
            style="display:none;"
          >

        </div>

        <!-- Total Marks -->

        <div class="input-group">

          <label>Total Marks</label>

          <input
            id="total"
            placeholder="e.g. 50"
          >

        </div>

      </div>

      <!-- SECTION SETTINGS -->

      <h3>📊 Section Settings</h3>

      <div class="section-box">

        <!-- SECTION A -->

        <div class="section">

          <h4>Section A</h4>

          <input
            id="section_a"
            placeholder="Marks"
          >

          <select
            id="questions_a"
            onchange="handleCustom('questions_a','custom_a')"
          >

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="custom">Custom</option>

          </select>

          <input
            id="custom_a"
            placeholder="Custom number"
            style="display:none;"
          >

          <label>Question Type</label>

          <select id="type_a">

            <option value="Mixed">Mixed</option>

            <option value="MCQ">MCQ</option>

            <option value="Very Short Answer">
              Very Short Answer
            </option>

            <option value="Short Answer">
              Short Answer
            </option>

            <option value="Long Answer">
              Long Answer
            </option>

            <option value="Case Study">
              Case Study
            </option>

            <option value="Assertion-Reason">
              Assertion-Reason
            </option>

            <option value="Application Based">
              Application Based
            </option>

          </select>

        </div>

        <!-- SECTION B -->

        <div class="section">

          <h4>Section B</h4>

          <input
            id="section_b"
            placeholder="Marks"
          >

          <select
            id="questions_b"
            onchange="handleCustom('questions_b','custom_b')"
          >

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="custom">Custom</option>

          </select>

          <input
            id="custom_b"
            placeholder="Custom number"
            style="display:none;"
          >

          <label>Question Type</label>

          <select id="type_b">

            <option value="Mixed">Mixed</option>

            <option value="MCQ">MCQ</option>

            <option value="Very Short Answer">
              Very Short Answer
            </option>

            <option value="Short Answer">
              Short Answer
            </option>

            <option value="Long Answer">
              Long Answer
            </option>

            <option value="Case Study">
              Case Study
            </option>

            <option value="Assertion-Reason">
              Assertion-Reason
            </option>

            <option value="Application Based">
              Application Based
            </option>

          </select>

        </div>

        <!-- SECTION C -->

        <div class="section">

          <h4>Section C</h4>

          <input
            id="section_c"
            placeholder="Marks"
          >

          <select
            id="questions_c"
            onchange="handleCustom('questions_c','custom_c')"
          >

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="custom">Custom</option>

          </select>

          <input
            id="custom_c"
            placeholder="Custom number"
            style="display:none;"
          >

          <label>Question Type</label>

          <select id="type_c">

            <option value="Mixed">Mixed</option>

            <option value="MCQ">MCQ</option>

            <option value="Very Short Answer">
              Very Short Answer
            </option>

            <option value="Short Answer">
              Short Answer
            </option>

            <option value="Long Answer">
              Long Answer
            </option>

            <option value="Case Study">
              Case Study
            </option>

            <option value="Assertion-Reason">
              Assertion-Reason
            </option>

            <option value="Application Based">
              Application Based
            </option>

          </select>

        </div>

      </div>

      <!-- PYQ UPLOAD -->

      <div class="input-group">

        <label>
          Upload Previous Year Papers
          <span style="font-size:12px; color:gray;">
            (Optional • Max 5 Files)
          </span>
        </label>

        <input
          type="file"
          id="pyq_files"
          multiple
          accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"
        >

      </div>

      <!-- INSTRUCTIONS -->

      <div class="input-group">

        <label>Instructions (one per line)</label>

        <textarea
          id="instructions"
          placeholder="e.g.
No negative marking
All questions compulsory"
        ></textarea>

      </div>

      <!-- ANSWER KEY -->

      <div class="toggle-box">

        <label>Include Answer Key</label>

        <input
          type="checkbox"
          id="includeAnswers"
          checked
        >

      </div>

      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >
        ⏳ Generating...
      </div>

      <!-- GENERATE BUTTON -->

      <button
        onclick="generatePDF()"
        class="btn"
      >
        🚀 Generate Exam Paper
      </button>

      <!-- DOWNLOAD RESULT -->

      <div class="result">

        <a
          id="downloadLink"
          target="_blank"
        ></a>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
