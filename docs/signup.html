<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"    
    >
    
    <title>Signup</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>
                Create an account
            </h1>
            <p>
                Join AI Exam Generator
            </p>
            <form id="signupForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit">
                    Signup
                </button>
            </form>
            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
