<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
    name="viewport" content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
    rel="stylesheet"
    href="css/auth.css"
    >

</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>
                Welcome Back!
            </h1>
            <p>
                Login to your account
            </p>
            <form id="loginForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
                <button type="submit">
                    Login
                </button>
            </form>
            <p>
                Don't have an account?
                <a href="signup.html">
                    Signup
                </a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
